<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emil Ruben Brandt — Fotografie</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <p>Kunstfotografie – Emil Ruben Brandt</p>
        <div style="height: 10px;"></div>
        <p>Hanau, Hesse, Germany</p>
        <div style="height: 35px;"></div>
        <p>Thanks for stopping by. Take a look around and stumble upon something that resonates with you. If you'd like to share some feedback or want to get in touch, feel free to message me:</p>
        <div style="height: 10px;"></div>
        <p><a href="mailto:emilrubenbrandt@gmail.com">emilrubenbrandt@gmail.com</a></p>
    </header>
    <main>
         <figure>
             <img src="images/Bild 6.jpg" alt="">
         </figure>

         <figure>
             <img src="images/Bild 6 (1).jpg" alt="">
         </figure>

    </main>
    <footer>
        <p>© Emil Ruben Brandt</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const images = document.querySelectorAll('figure img');
            
            images.forEach(img => {
                const checkFormat = () => {
                    const ratio = img.naturalWidth / img.naturalHeight;
                    
                    // Wenn breiter als hoch: Querformat
                    if (ratio > 1) {
                        img.dataset.format = 'landscape';
                    } else {
                        img.dataset.format = 'portrait';
                    }
                };
                
                // Falls Bild bereits geladen ist
                if (img.complete) {
                    checkFormat();
                } else {
                    // Warten bis Bild geladen ist
                    img.addEventListener('load', checkFormat);
                }
            });
        });
    </script>
</body>
</html>
